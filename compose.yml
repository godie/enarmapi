services:
  database:
    image: mysql:8.0
    volumes:
      - db_mysql_data:/var/lib/mysql
      - ./docker/mysql/init-grant.sql:/docker-entrypoint-initdb.d/01-grant-enarm.sql:ro
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: enarmapi_development
      MYSQL_USER: enarm
      MYSQL_PASSWORD: test
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: database
      DATABASE_USER: enarm
      DATABASE_PASSWORD: test
      DATABASE_NAME: enarmapi_development
      DATABASE_PORT: "3306"
      RAILS_ENV: development
    depends_on:
      database:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  db_mysql_data: {}
