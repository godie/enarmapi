# Configuración actual: MySQL para development, test y production.
# Para volver a PostgreSQL, ver docs/POSTGRESQL_MIGRATION.md
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  username: <%= ENV['DATABASE_USER'] || "enarm" %>
  password: <%= ENV['DATABASE_PASSWORD'] || "test" %>
  port: <%= ENV['DATABASE_PORT'] || "3306" %>
  host: <%= ENV['DATABASE_HOST'] || "127.0.0.1" %>

development:
  <<: *default
  database: enarmapi_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: enarmapi_test

production:
  <<: *default
  database: enarmapi_production
  username: <%= ENV['DATABASE_USER'] %>
  password: <%= ENV['DATABASE_PASSWORD'] %>
  host: <%= ENV['DATABASE_HOST'] || "127.0.0.1" %>
