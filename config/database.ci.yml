# config/database.ci.yml - usado por GitHub Actions (MySQL)
test:
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: <%= ENV["MYSQL_DATABASE"] || "enarmapi_test" %>
  username: <%= ENV['MYSQL_USER'] || 'root' %>
  password: <%= ENV["MYSQL_ROOT_PASSWORD"] || ENV["MYSQL_PASSWORD"] %>
  host: 127.0.0.1
  port: 3306
